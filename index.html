<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>JULIMUSE</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #07111f; color: #f3f6fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #31244a 0, transparent 55%), #07111f; }
    main { width: min(100%, 560px); padding: 48px 32px; text-align: center; border: 1px solid #ffffff20; border-radius: 24px; background: #ffffff08; box-shadow: 0 24px 80px #0006; }
    .mark { font-size: 32px; }
    h1 { margin: 18px 0 12px; font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: .04em; }
    p { margin: 0; color: #b7c1d1; line-height: 1.7; }
    footer { margin-top: 32px; color: #8491a5; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>JULIMUSE</h1>
    <p>A new space is taking shape. Please check back soon.</p>
    <footer>© JULIMUSE</footer>
  </main>
</body>
</html>
